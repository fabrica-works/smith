id = "history"
version = 2
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 330
prompt = "Follow the 32-file pointer chain beginning at node-93e158a7.txt. Read each whole file using exactly one read call per completion. Each file has a value and a next pointer; ignore its padding. Keep a running sum and your next filename as you go, including across any summary. Do not list, batch reads, use shell, write, edit, or delegate. After the 32nd read reaches END, finish with exactly the word ALPHA, one space, then the sum.\n"
seed_sha256 = "aea294bc0d91c756ea8377fa43ae1644dbf9a003e9b50947b1b1a8fd4820f336"
guards = ["domain/session.md, section 8", "protocol/limits.md, section 3"]
deciding = ["end", "exit-code", "answer", "tool-call", "calls-per-response", "completions", "prompt-within-window"]

[budget]
seconds = 300
turns = 64
spend = 2.0

[smith]
"models.\"{model}\".window" = 272000
"budget.reserve.seconds" = 150
"models.\"{model}\".output" = 8192
"deployment.calls_per_response" = 1
"deployment.tool_payload" = 8192
"deployment.read_window" = 8192

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "^ALPHA 528$"
[[event]]
check = "tool-call"
tool = "read"
count = { exactly = 32 }
verdict = "read"
[[event]]
check = "calls-per-response"
tool = "read"
at_most = 1
[[event]]
check = "completions"
count = { at-least = 33 }
before = "answer"
[[event]]
check = "prompt-within-window"

[[variant]]
name = "small-window"
deciding = ["conversation-opened", "compaction-choice"]
[variant.smith]
"models.\"{model}\".window" = 65536
[[variant.event]]
check = "conversation-opened"
kind = "compaction"
count = { at-least = 1 }
[[variant.event]]
check = "compaction-choice"
