id = "smoke-tools"
version = 2
protected = ["README.md"]
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 330
prompt = "Complete these steps in order: (1) list the directory . exactly once; (2) read ./README.md and retain its frozen token; (3) invoke shell exactly once with printenv SMITH_BENCH_NONCE > smoke-env.txt; command -v cargo >> smoke-env.txt; (4) check that shell exited successfully; (5) finish with the frozen README token. The list, read, and shell steps are required before finish. This message supplies the complete task: continue through all steps without calling wait or pausing for another user message. Do not edit README.md or make any additional shell call.\n"
seed_sha256 = "452c822eb37147a50a5ddf1271245fad2f5884ded6513b8f813e81629627fb85"
guards = ["domain/tools.md, section 2", "domain/tools.md, section 5", "protocol/events.md, section 5"]
deciding = ["end", "exit-code", "answer", "pattern:smoke-env.txt", "tool-call", "stream-whole", "paired", "spend-sums", "usage-sums", "nothing-lost", "tree-ended", "protected-unchanged"]

[budget]
seconds = 300
turns = 12

[smith]
window = 272000
output = 32000
reasoning_item = 65536
head = 60000
idle = 300000
connect = 10000
handshake = 10000
conversations = 5
tool_payload = 40960
file_bytes = 1048576
calls_per_response = 16
read_window = 32768
guide = 16384
shell_output = 16384
shell_head = 16384
shell_tail = 49152
search_hits = 100
search_bytes = 16384
list_entries = 512
llm_pool = 134217728
memory = 2147483648

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "ALPHA"
[[event]]
check = "run-completed"
status = "accepted"
[[outcome]]
check = "pattern"
path = "smoke-env.txt"
pattern = "^SMITH_SMOKE_NONCE_012\n/[^\n]*cargo\n$"
[[event]]
check = "tool-call"
tool = "list"
count = { at-least = 1 }
verdict = "listed"
[[event]]
check = "tool-call"
tool = "shell"
count = { exactly = 1 }
verdict = "exited"
exit = 0
[[event]]
check = "usage-sums"

[environment]
SMITH_BENCH_NONCE = "SMITH_SMOKE_NONCE_012"

[[variant]]
name = "child"
prompt = "Complete these steps in order: (1) delegate exactly one read-only child with max_turns 2 to read ./README.md and report its frozen token; receive the child's returned result before proceeding; (2) as the main agent, list the directory . exactly once; (3) as the main agent, read ./README.md; (4) as the main agent, invoke shell exactly once with printenv SMITH_BENCH_NONCE > smoke-env.txt; command -v cargo >> smoke-env.txt; (5) check that shell exited successfully; (6) finish with ALPHA. The child's returned answer completes the delegation step; immediately continue the main-agent steps even if that answer reports a budget stop. The child does not replace the main agent's required list, read, shell, and finish steps. This message supplies the complete task: do not call wait or pause for another user message after the child returns. Do not modify README.md or make any additional shell call.\n"
deciding = ["conversation-opened"]
[[variant.event]]
check = "conversation-opened"
kind = "child"
count = { exactly = 1 }
