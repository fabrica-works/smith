id = "smoke-tools"
version = 1
protected = ["README.md"]
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 330
prompt = "List the directory . once, read ./README.md, and invoke shell exactly once to run printenv SMITH_BENCH_NONCE > smoke-env.txt; command -v cargo >> smoke-env.txt. Check that shell exits successfully, then finish with the frozen README token. Do not edit README.md or use any extra shell call.\n"
seed_sha256 = "452c822eb37147a50a5ddf1271245fad2f5884ded6513b8f813e81629627fb85"
guards = ["domain/tools.md, section 2", "domain/tools.md, section 5", "protocol/events.md, section 5"]
deciding = ["end", "exit-code", "answer", "pattern:smoke-env.txt", "tool-call", "stream-whole", "paired", "spend-sums", "usage-sums", "nothing-lost", "tree-ended", "protected-unchanged"]

[budget]
seconds = 300
turns = 12

[smith]
window = 272000
output = 32000
reasoning_item = 65536
head = 60000
idle = 300000
connect = 10000
handshake = 10000
conversations = 6
tool_payload = 40960
file_bytes = 1048576
calls_per_response = 16
read_window = 32768
guide = 16384
shell_output = 16384
shell_head = 16384
shell_tail = 49152
search_hits = 100
search_bytes = 16384
list_entries = 512
llm_pool = 134217728
memory = 2147483648

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "ALPHA"
[[event]]
check = "run-completed"
status = "accepted"
[[outcome]]
check = "pattern"
path = "smoke-env.txt"
pattern = "^SMITH_SMOKE_NONCE_012\n/[^\n]*cargo\n$"
[[event]]
check = "tool-call"
tool = "list"
count = { exactly = 1 }
verdict = "listed"
[[event]]
check = "tool-call"
tool = "shell"
count = { exactly = 1 }
verdict = "exited"
exit = 0
[[event]]
check = "usage-sums"

[environment]
SMITH_BENCH_NONCE = "SMITH_SMOKE_NONCE_012"

[[variant]]
name = "child"
prompt = "First delegate one read-only child with max_turns 2 to read README.md and report its token, and wait for its result. Then list . once, read README.md, invoke shell exactly once to run printenv SMITH_BENCH_NONCE > smoke-env.txt; command -v cargo >> smoke-env.txt, and finish with ALPHA. Do not modify README.md.\n"
deciding = ["conversation-opened"]
[[variant.event]]
check = "conversation-opened"
kind = "child"
count = { exactly = 1 }
