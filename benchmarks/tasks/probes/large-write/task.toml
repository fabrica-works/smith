id = "large-write"
version = 2
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 330
prompt = "Read source.txt in one read call with window 32768. Then copy its complete content, including the final newline, into payload.txt using exactly one write call. Copy the text as given rather than summarizing or generating new text. Do not use shell, edit, or delegate. Then finish with ALPHA.\n"
seed_sha256 = "6eb2bad76a68e80a8fc5044c9153146a1448959a6773d82966a6bc32be6dbd98"
guards = ["domain/tools.md, section 3", "protocol/limits.md, section 6"]
deciding = ["end", "exit-code", "answer", "file-digest:payload.txt", "tool-call", "no-stop", "run-completed"]

[budget]
seconds = 300
turns = 12

[smith]
window = 272000
output = 32000
reasoning_item = 65536
head = 60000
idle = 300000
connect = 10000
handshake = 10000
conversations = 6
tool_payload = 40960
file_bytes = 1048576
calls_per_response = 16
read_window = 32768
guide = 16384
shell_output = 16384
shell_head = 16384
shell_tail = 49152
search_hits = 100
search_bytes = 16384
list_entries = 512
llm_pool = 134217728
memory = 2147483648

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "ALPHA"
[[event]]
check = "run-completed"
status = "accepted"
[[outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "2aa273aeb8208ed828c366905bca51a53c76e0bea87d75becb58dbdbe87c15e3"
[[event]]
check = "tool-call"
tool = "write"
count = { exactly = 1 }
input_bytes_at_least = 32768
verdict = "written"
[[event]]
check = "no-stop"
stop = "max_tokens"

[[variant]]
name = "oversized"
replace_checks = true
prompt = "Read oversized-source.txt in two read calls with window 32768, continuing at the next line reported by the first read. First attempt exactly one write of payload.txt containing the complete source text, including its final newline. After the oversized refusal, copy that same text in pieces: write an initial piece and append the remaining content with edit, keeping each call within the declared payload. Preserve every character and newline rather than summarizing or generating new text. Never use shell or delegate. Then finish with ALPHA.\n"
deciding = ["end", "exit-code", "answer", "file-digest:payload.txt", "blocks", "tool-call", "no-stop", "run-completed"]
[[variant.outcome]]
check = "end"
end = "completed"
[[variant.outcome]]
check = "exit-code"
code = 0
[[variant.outcome]]
check = "answer"
pattern = "ALPHA"
[[variant.outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "8c2cc2fe1a85b3285653f587865dbcbde009f134a2b99c6fca66ac20f56fa5b8"
[[variant.event]]
check = "blocks"
oversized = { exactly = 1 }
[[variant.event]]
check = "tool-call"
tool = "write"
count = { at-least = 1 }
verdict = "written"
[[variant.event]]
check = "tool-call"
tool = "edit"
count = { at-least = 1 }
verdict = "edited"
[[variant.event]]
check = "no-stop"
stop = "max_tokens"
[[variant.event]]
check = "run-completed"
status = "accepted"
