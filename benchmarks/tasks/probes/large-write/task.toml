id = "large-write"
version = 9
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 660
prompt = "Write payload.txt in one write call with numbered lines from Line 0001 through Line 0643 inclusive. Each line is exactly like \"Line 0001: The quick brown fox jumps over the lazy dog.\" with its four-digit number and a final newline. This is 36008 bytes. Do not read, use shell, edit, or delegate. Finish with ALPHA after written.\n"
seed_sha256 = "231c7a416929fda166e8d336cfcf3f7186dcb496ef96d77d86ab52cc42967580"
guards = ["domain/tools.md, section 3", "protocol/limits.md, section 6"]
deciding = ["end", "exit-code", "answer", "file-size:payload.txt", "written-file", "tool-call", "no-stop", "run-completed"]

[budget]
seconds = 300
turns = 12

[smith]
"budget.reserve.seconds" = 150
"deployment.file_bytes" = 1048576
"deployment.conversations" = 5
"deployment.tool_payload" = 40960
"deployment.read_window" = 32768

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "ALPHA"
[[event]]
check = "run-completed"
status = "accepted"
[[outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "c79b7169a8f3806be73716a64974decc02385ce1769795997903a0bbd57aa94d"
[[event]]
check = "tool-call"
tool = "write"
count = { exactly = 1 }
input_bytes_at_least = 32768
verdict = "written"
[[event]]
check = "no-stop"
stop = "max_tokens"

[[outcome]]
check = "file-size"
path = "payload.txt"
bytes_at_least = 32768
[[event]]
check = "written-file"
path = "payload.txt"
content_bytes_at_least = 32768

[[variant]]
name = "oversized"
replace_checks = true
prompt = "This checks how an intentionally too-large call is refused. First make ONE write to payload.txt containing numbered lines Line 0001 through Line 0280 inclusive. Each line is exactly like \"Line 0001: The quick brown fox jumps over the lazy dog.\" with its four-digit number and a final newline. The 15995-byte JSON call is deliberately over the stated 13848-byte call-input bound and is MEANT TO BE REFUSED. After that protocol refusal, create a smaller payload.txt with numbered lines Line 0001 through Line 0060 inclusive: write lines 0001 through 0030 in one write, then append lines 0031 through 0060 with ONE edit. Each accepted piece fits the 2048-byte payload; the final file is 3360 bytes, above one payload. Do not use shell or delegate. Finish with ALPHA after the write and edit are accepted.\n"
deciding = ["end", "exit-code", "answer", "file-size:payload.txt", "file-pieces", "oversized-write", "no-stop", "run-completed"]
[[variant.outcome]]
check = "end"
end = "completed"
[[variant.outcome]]
check = "exit-code"
code = 0
[[variant.outcome]]
check = "answer"
pattern = "ALPHA"
[[variant.outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "f9ba04dc90f64462cb71c9676039c14a9c3a6dfca4146512f586ea68bcff621d"
[[variant.event]]
check = "blocks"
oversized = { exactly = 1 }
[[variant.outcome]]
check = "file-size"
path = "payload.txt"
bytes_at_least = 2049
[[variant.event]]
check = "file-pieces"
path = "payload.txt"
bytes_above = 2048
file_bytes = 1048576
[[variant.event]]
check = "no-stop"
stop = "max_tokens"
[[variant.event]]
check = "run-completed"
status = "accepted"

[[variant.event]]
check = "oversized-write"
path = "payload.txt"
content_bytes_above = 2048
protocol_input_bytes_above = 13848

[variant.smith]
"deployment.tool_payload" = 2048
"deployment.read_window" = 2048
