guards = ["domain/tools.md, section 3", "domain/tools.md, section 5"]
protected = ["test.sh", "manual.txt"]
deciding = ["end", "exit-code", "answer", "tool-call", "tool-result-bytes", "protected-unchanged", "stream-whole", "tree-ended"]
[budget]
seconds = 150
turns = 8
[smith]
"budget.reserve.seconds" = 75
"deployment.conversations" = 1
"deployment.calls_per_response" = 4
"deployment.tool_payload" = 4096
"deployment.read_window" = 4096
"deployment.shell_head" = 8192
"deployment.shell_tail" = 8192
[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "(?is)budget_total.*17.*19"
[[outcome]]
check = "protected"
path = "test.sh"
[[outcome]]
check = "protected"
path = "manual.txt"
[[outcome]]
check = "protected"
path = "range.txt"
[[event]]
check = "tool-call"
tool = "shell"
count = { exactly = 1 }
verdict = "exited"
exit = 1
[[event]]
check = "tool-result-bytes"
tool = "shell"
at_least = 10241

