id = "large-write"
version = 4
kind = "probe"
tier = "small"
effort = "low"
deadline_seconds = 330
prompt = "This is a literal transcription task, not a summary. Read source.txt in one read call with window 32768. The file has exactly 552 lines and 32768 ASCII bytes, including its final newline. The read display adds a line number and colon before each source line and a status footer after the file: remove only those display additions. Copy ALL 552 source lines, in their original order, into the content argument of exactly one write call to payload.txt. Preserve every character, blank line, repeated paragraph, and the final newline. Repeated paragraphs are intentional: do not skip or deduplicate any. The final source line is This is the end of the source report. Include that line. In particular, source lines 530 through 551 are exactly TWENTY-TWO consecutive lines of The work continued. Copy all twenty-two, each with its newline, then the final source line 552. Omitting even one of these lines makes the copy wrong. The complete write fits the declared model output and tool payload; make the write call rather than substituting a refusal or report. The complete file is returned by this read window; do not stop after a partial copy or report success without writing. Do not use shell, edit, or delegate. Your next action after reading must be the complete write call; finish with ALPHA only after the write reports written.\n"
seed_sha256 = "6eb2bad76a68e80a8fc5044c9153146a1448959a6773d82966a6bc32be6dbd98"
guards = ["domain/tools.md, section 3", "protocol/limits.md, section 6"]
deciding = ["end", "exit-code", "answer", "file-digest:payload.txt", "tool-call", "no-stop", "run-completed"]

[budget]
seconds = 300
turns = 12

[smith]
"budget.reserve.seconds" = 150
"deployment.file_bytes" = 1048576
"deployment.conversations" = 6
"deployment.tool_payload" = 40960
"deployment.read_window" = 32768

[[outcome]]
check = "end"
end = "completed"
[[outcome]]
check = "exit-code"
code = 0
[[outcome]]
check = "answer"
pattern = "ALPHA"
[[event]]
check = "run-completed"
status = "accepted"
[[outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "2aa273aeb8208ed828c366905bca51a53c76e0bea87d75becb58dbdbe87c15e3"
[[event]]
check = "tool-call"
tool = "write"
count = { exactly = 1 }
input_bytes_at_least = 32768
verdict = "written"
[[event]]
check = "no-stop"
stop = "max_tokens"

[[variant]]
name = "oversized"
replace_checks = true
prompt = "This is a literal transcription task, not a summary. Read oversized-source.txt in two read calls with window 32768, continuing at the next line reported by the first read. The file has exactly 827 lines and 50000 ASCII bytes, including its final newline. The read display adds a line number and colon before each source line and a status footer: remove only those display additions. Preserve ALL 827 source lines in their original order, including every character, blank line, repeated paragraph, and the final newline. Repeated paragraphs are intentional: do not skip or deduplicate any. The final source line is This is the end of the source report. Include that line. In particular, source lines 818 through 826 are exactly NINE consecutive lines of The work continued. Copy all nine, each with its newline, then the final source line 827. Omitting even one of these lines makes the copy wrong. Make the required tool calls rather than substituting a refusal or report. First attempt exactly one write call to payload.txt whose content argument contains the ENTIRE file, even though it exceeds the declared payload. After that oversized refusal, copy the SAME complete text in pieces: write an initial piece and append the remainder with edit, keeping each repair call within the declared payload. Do not summarize, make a partial copy, or finish before both repair tools report success. Never use shell or delegate. Finish with ALPHA only after payload.txt contains the complete source text.\n"
deciding = ["end", "exit-code", "answer", "file-digest:payload.txt", "blocks", "tool-call", "no-stop", "run-completed"]
[[variant.outcome]]
check = "end"
end = "completed"
[[variant.outcome]]
check = "exit-code"
code = 0
[[variant.outcome]]
check = "answer"
pattern = "ALPHA"
[[variant.outcome]]
check = "file-digest"
path = "payload.txt"
sha256 = "8c2cc2fe1a85b3285653f587865dbcbde009f134a2b99c6fca66ac20f56fa5b8"
[[variant.event]]
check = "blocks"
oversized = { exactly = 1 }
[[variant.event]]
check = "tool-call"
tool = "write"
count = { at-least = 1 }
verdict = "written"
[[variant.event]]
check = "tool-call"
tool = "edit"
count = { at-least = 1 }
verdict = "edited"
[[variant.event]]
check = "no-stop"
stop = "max_tokens"
[[variant.event]]
check = "run-completed"
status = "accepted"
