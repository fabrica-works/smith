# The two test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones, within 15 seconds; and the fuzzy one, the test
# binaries named fuzzy_* beside each world's focused tests, within a minute. A
# suite past its budget fails, naming the tests it stopped; a test past its
# slow period is flagged SLOW as it runs.

[profile.default]
default-filter = "not binary(/^fuzzy_/) and not binary(=live)"
global-timeout = "15s"
slow-timeout = { period = "3s" }

# Start the focused tests measured over one second before the worlds.
[[profile.default.overrides]]
filter = "(package(=smith) and test(=a_first_run_signs_in_and_ends_with_a_commit_in_place)) or (package(=smith) and test(=smith_on_a_terminal_signs_in_and_commits_in_place)) or (package(=smith) and test(=standard_profile_runs_a_large_coding_write_and_the_following_checks)) or (package(=smith) and test(=the_live_outcome_referee_runs_on_the_shared_fake_binary_harness)) or (package(=smith-agent-process-world) and test(=maximum_run_context_and_provider_completion_fit_each_process_at_every_iteration)) or (package(=smith-agent-service) and test(=tests::an_actual_full_escaped_prompt_fits_sink_output_and_allocation_at_every_chunk)) or (package(=smith-agent-process-world) and test(=a_reasoning_turn_that_stops_after_a_read_is_told_and_nudged)) or (package(=smith-bench) and test(=typed_event_stream_classification_usage_and_author_predicates)) or (package(=smith-bench) and test(=a_replay_arm_runs_through_the_probe_command_and_prints_one_line)) or (package(=smith-agent-world) and test(=every_transient_history_refusal_is_exact_and_starts_no_provider_or_tool_effect)) or (package(=smith-real-world) and test(=a_chat_ends_with_a_commit_in_place)) or (package(=smith-protocol-llm-world) and test(=restored_root_arrays_payload_rewrites_and_turn_copies_stay_within_the_attained_bound)) or (package(=smith-run-world) and test(=cancels_find_runs_in_every_state)) or (package(=smith-session-world) and test(=a_domain_with_every_session_full_stays_within_its_worst_case)) or (package(=smith-tools-world) and test(=a_domain_with_every_kit_full_stays_within_its_worst_case)) or (package(=smith-agent-shell) and test(=config::tests::drawn_declarations_are_named_or_fit_complete_process_memory)) or (package(=smith-agent-service) and test(=tests::random_tool_render_caps_derive_a_machine_that_holds_them)) or (package(=smith-agent-shell) and test(=config::tests::native_validated_dense_prompts_fit_the_actual_joint_receiving_ceiling)) or (package(=smith-protocol-llm) and test(=tests::random_outcomes_at_random_caps_fit_their_derived_render_bound))"
priority = 20

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) and not binary(=live)"
global-timeout = "60s"
slow-timeout = { period = "20s" }

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "1h"
slow-timeout = { period = "60s" }

# Real backends are opt-in and never part of the merge gate.
[profile.live]
default-filter = "binary(=live)"
global-timeout = "10m"
slow-timeout = { period = "60s" }
test-threads = 1
retries = 0
fail-fast = false
